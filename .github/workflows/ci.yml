name: Benchmark hosted CI
run-name: ${{ inputs.dispatch_id && format('BuildTrace {0} {1} {2}', inputs.oracle_mode && 'oracle' || 'target', inputs.source_sha || github.sha, inputs.dispatch_id) || format('Benchmark CI {0}', github.sha) }}

on:
  push:
    branches: ["buildtrace-inputs/**"]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full candidate SHA for independent verification
        required: false
        default: ""
        type: string
      oracle_mode:
        description: Verify both distributions against the separate trusted bundle
        required: false
        default: false
        type: boolean
      dispatch_id:
        description: Unique dispatch correlation ID
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CANDIDATE_DIR: ${{ github.workspace }}/_candidate
      TRUSTED_DIR: ${{ github.workspace }}/_trusted
      EVIDENCE_DIR: ${{ github.workspace }}/_evidence
      WORK_DIR: ${{ github.workspace }}/_work
      CONTRACT_PATH: infra/research_v2/contract.json
      REQUESTED_SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
      WORKFLOW_SHA: ${{ github.sha }}
      ORACLE_MODE: ${{ inputs.oracle_mode && 'true' || 'false' }}
      RUN_ID: ${{ github.run_id }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - name: Check out pinned verifier revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          path: _trusted
          persist-credentials: false
      - name: Check out candidate revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          path: _candidate
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11.11"
          check-latest: false
      - name: Provision pinned verification tools
        run: |
          python -m venv "$RUNNER_TEMP/research-tools"
          "$RUNNER_TEMP/research-tools/bin/python" -m pip install --only-binary=:all: --disable-pip-version-check --index-url https://pypi.org/simple pip==25.0.1 pytest==8.3.5 build==1.2.2.post1 packaging==24.2 pluggy==1.5.0 iniconfig==2.0.0 pyproject-hooks==1.2.0
          echo "$RUNNER_TEMP/research-tools/bin" >> "$GITHUB_PATH"
      - name: Record candidate and protected inputs
        id: environment
        run: >-
          python "$TRUSTED_DIR/.github/research_v2/verify.py" init
          --candidate "$CANDIDATE_DIR" --trusted "$TRUSTED_DIR" --artifacts "$EVIDENCE_DIR" --work "$WORK_DIR"
          --contract-path "$CONTRACT_PATH" --oracle-mode "$ORACLE_MODE"
          --source-sha "$REQUESTED_SOURCE_SHA" --workflow-sha "$WORKFLOW_SHA"
          --run-id "$RUN_ID" --run-attempt "$RUN_ATTEMPT"
      - name: Resolve offline project
        run: >-
          python "$TRUSTED_DIR/.github/research_v2/verify.py" resolve
          --candidate "$CANDIDATE_DIR" --trusted "$TRUSTED_DIR" --artifacts "$EVIDENCE_DIR" --work "$WORK_DIR" --contract-path "$CONTRACT_PATH"
      - name: Run protected tests
        run: >-
          python "$TRUSTED_DIR/.github/research_v2/verify.py" public
          --candidate "$CANDIDATE_DIR" --trusted "$TRUSTED_DIR" --artifacts "$EVIDENCE_DIR" --work "$WORK_DIR" --contract-path "$CONTRACT_PATH"
      - name: Build distributions
        run: >-
          python "$TRUSTED_DIR/.github/research_v2/verify.py" build
          --candidate "$CANDIDATE_DIR" --trusted "$TRUSTED_DIR" --artifacts "$EVIDENCE_DIR" --work "$WORK_DIR" --contract-path "$CONTRACT_PATH"
      - name: Run example
        run: >-
          python "$TRUSTED_DIR/.github/research_v2/verify.py" cli
          --candidate "$CANDIDATE_DIR" --trusted "$TRUSTED_DIR" --artifacts "$EVIDENCE_DIR" --work "$WORK_DIR" --contract-path "$CONTRACT_PATH"
      - name: Check installed distributions
        run: >-
          python "$TRUSTED_DIR/.github/research_v2/verify.py" distributions
          --candidate "$CANDIDATE_DIR" --trusted "$TRUSTED_DIR" --artifacts "$EVIDENCE_DIR" --work "$WORK_DIR" --contract-path "$CONTRACT_PATH"
      - name: Verify protected evidence
        if: always() && steps.environment.outcome != 'skipped'
        run: >-
          python "$TRUSTED_DIR/.github/research_v2/verify.py" finalize
          --candidate "$CANDIDATE_DIR" --trusted "$TRUSTED_DIR" --artifacts "$EVIDENCE_DIR" --work "$WORK_DIR" --contract-path "$CONTRACT_PATH"
      - name: Upload execution evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bench-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: _evidence/
          if-no-files-found: warn
          retention-days: 30
