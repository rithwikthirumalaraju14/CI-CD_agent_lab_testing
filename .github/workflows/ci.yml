name: BuildTrace CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            ci/constraints.txt
      - name: Create clean environment
        run: |
          python -m venv .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Install project and test dependencies
        run: |
          python -m pip install setuptools==75.8.2 wheel==0.45.1
          python -m pip install --editable ".[dev]" --constraint ci/constraints.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Run tests
        run: python -m pytest --junitxml=artifacts/pytest.xml
      - name: Build distributable
        run: python -m build
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildtrace-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: warn
