[build-system]
requires = []
build-backend = "_build_backend"
backend-path = ["ci"]

[project]
name = "bench-artifacts"
version = "1.4.0"
description = "Offline artifacts application"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "build>=1.2,<2"]

[tool.bench.package]
wheel_include = ["*.py", "*.json"]
sdist_include = ["*.toml", "ci/*.py", "src/bench_app/*.py", "src/bench_app/**/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
